# systemd drop-in: run the Rust server instead of server.py.
# Install:  sudo mkdir -p /etc/systemd/system/hindsight.service.d
#           sudo cp server-rs/hindsight-rust.conf /etc/systemd/system/hindsight.service.d/
#           sudo systemctl daemon-reload && sudo systemctl restart hindsight
# Undo:     sudo rm /etc/systemd/system/hindsight.service.d/hindsight-rust.conf
#           sudo systemctl daemon-reload && sudo systemctl restart hindsight
[Service]
ExecStart=
ExecStart=/home/eberhard0/hindsight/bin/hindsight-server
Environment=HINDSIGHT_ROOT=/home/eberhard0/hindsight
