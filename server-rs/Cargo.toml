[package]
name = "hindsight-server"
version = "1.0.0"
edition = "2021"
description = "Hindsight sync server: drop-in Rust replacement for server.py"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
regex = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
csv = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
