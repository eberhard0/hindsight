name: Android

# Every push/PR: run the web tests and build an (unsigned) release APK as a sanity check.
# Every v* tag: build a signed AAB + APK and attach them to a GitHub Release.
# Signing needs four repository secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # attach build outputs to the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Web tests
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          node core.test.js
          node native.test.js

      - name: Sync the web app into the Capacitor project
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          mkdir -p www
          cp ../index.html www/index.html
          npx cap sync android

      - name: Version from tag
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build release bundle and APK
        working-directory: app/android
        env:
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: hindsight-${{ steps.ver.outputs.name }}
          path: |
            app/android/app/build/outputs/bundle/release/*.aab
            app/android/app/build/outputs/apk/release/*.apk

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/android/app/build/outputs/bundle/release/*.aab
            app/android/app/build/outputs/apk/release/*.apk
